model:
  name: Qwen/Qwen2.5-32B-Instruct
  revision: 5ede1c97bbab6ce5cda5812749b4c0bdf79b18dd
  backend: hf
  required_gpus: 2
  device_map: auto
  dtype: bfloat16
  attn_implementation: flash_attention_2
  trust_remote_code: false

state_materialization:
  benchmark:
    history_families: [pointer]
    final_family: pointer
    bits: [3]
    history_steps: [1, 2, 4]
    formats: [prose, assignments]
    examples_per_cell: 36
    seed: 7142051
    require_distinct_diagnostics: true
    balance_current_states: true
    state_representation: symbols
    state_symbols: [α, β, γ, δ, ε, κ, λ, μ]
  decision:
    min_control_accuracy_lower: 0.85
    min_candidate_mass_lower: 0.80
    min_admitted_cases: 50
    min_update_minus_synthesize_lower: 0.30
    max_synthesize_compose_gap: 0.15
    min_format_update_minus_synthesize_lower: 0.20
    min_routing_cases: 50
    max_compose_given_synthesize_upper: 0.25
    min_synthesize_minus_compose_lower: 0.20
    min_format_synthesize_minus_compose_lower: 0.15
  prompt:
    mode: chat
    system: Execute the state program exactly and return one Greek state symbol.
