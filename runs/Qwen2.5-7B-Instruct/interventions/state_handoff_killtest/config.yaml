model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: a09a35458c702b33eeacc393d103063234e8bc28
  backend: hf
  required_gpus: 1
  device_map:
    "": 0
  dtype: bfloat16
  attn_implementation: flash_attention_2
  trust_remote_code: false

state_materialization:
  decision:
    min_control_accuracy_lower: 0.85
    min_candidate_mass_lower: 0.80
    min_admitted_cases: 50
    min_update_minus_synthesize_lower: 0.30
    max_synthesize_compose_gap: 0.15
    min_format_update_minus_synthesize_lower: 0.20
    min_routing_cases: 50
    max_compose_given_synthesize_upper: 0.25
    min_synthesize_minus_compose_lower: 0.20
    min_format_synthesize_minus_compose_lower: 0.15
  prompt:
    mode: chat
    system: Execute the state program exactly and return one decimal integer.

state_abstraction:
  benchmark:
    bits: 3
    history_steps: [1, 2, 4, 8]
    groups_per_horizon: 15
    paths_per_state: 8
    formats: [prose]
    seed: 7212026

explicit_handoff:
  gate:
    min_gold_accuracy: 0.90
    min_h2_self_improvement: 0.20
    min_h4_stepwise_accuracy: 0.90
  prompt:
    mode: chat
    system: Execute the state program exactly and return one decimal integer.

state_handoff_training:
  phase1_source_run: runs/Qwen2.5-32B-Instruct/interventions/state_abstraction_matched_history
  conditions: [outcome_only, explicit_handoff]
  evaluation_adapter: best
  dataset:
    bits: 3
    seed: 721301
    train_examples: 20000
    validation_examples: 2000
    train_horizons: [1, 2]
    validation_horizons: [1, 2]
    test_horizons: [2, 4, 8]
    train_program_contexts: 50
    validation_program_contexts: 15
    test_program_contexts: 30
    test_paths_per_state: 4
  lora:
    rank: 16
    alpha: 32
    dropout: 0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  training:
    seed: 721401
    max_sequence_length: 256
    microbatch: 8
    gradient_accumulation: 8
    effective_batch: 64
    optimizer: adamw
    learning_rate: 0.0001
    weight_decay: 0
    warmup_ratio: 0.03
    epochs: 2
    evaluation_interval: 250
    max_gradient_norm: 1.0
    gradient_checkpointing: true
  pilot_gate:
    min_ood_improvement: 0.10
    min_same_state_agreement: 0.90
    min_gold_gap_closed: 0.50
  prompt:
    mode: chat
    system: Execute the state program exactly and return one decimal integer.

state_handoff_continuation:
  profiles:
    probe:
      horizons: [2, 4, 8, 16]
      context_count: 10
      paths_per_state: 2
      block_sizes: [2]
      seed: 721501
    confirmation:
      horizons: [2, 4, 8, 16, 32]
      context_count: 30
      paths_per_state: 4
      block_sizes: [1, 2]
      seed: 721601
