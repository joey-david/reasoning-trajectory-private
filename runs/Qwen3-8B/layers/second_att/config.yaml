model:
  name: Qwen/Qwen3-8B
  backend: hf
  device_map: auto
  dtype: bfloat16
  trust_remote_code: true
  revision: b968826d9c46dd6066d109eabc6255188de91218
  attn_implementation: flash_attention_2

dataset:
  source: hf
  path: HuggingFaceH4/aime_2024
  revision: 2fe88a2f1091d5048c0f36abc874fb997b3dd99a
  name: null
  split: train
  adapter: aime
  sample_ids:
    - aime_2024_71
  sample_limit: 1
  sample_offset: 0
  shuffle_seed: null

generation:
  max_new_tokens: 32768
  num_samples_per_item: 1
  base_seed: 948684
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  cap_fallback:
    prefix: "</think>\n\nTherefore the final answer should be\nAnswer:"
    min_new_tokens: 1
    max_new_tokens: 8

capture:
  enabled: true
  layers: [:] # use [:] to capture all layers
  diagnostics: false

prompt:
  mode: chat
  system: You are a careful competition mathematician.
  instruction: |-
    Solve the problem. Check the result.

    End with exactly: Answer: N

    Replace N with an integer from 000 through 999.

analysis:
  produced_answer_regex: (?i)(?:\\boxed\{|(?:Final\s+)?Answer\s*:\s*)(\d{1,3})
  gold_answer_regex: (\d{1,3})
  hard_question_limit: 30
  think_end_token_id: 151668
  layer_variations:
    token_2d: 0
    max_3d_tokens: 160
