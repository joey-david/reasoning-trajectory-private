model:
  name: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  backend: hf
  device_map:
    "": 0
  dtype: bfloat16
  attn_implementation: flash_attention_2
  trust_remote_code: true

dataset:
  source: hf
  path: Qwen/PolyMath
  revision: 71e0db902e0ece05e208dfd8b1695bd3d95cf130
  name: en
  split: high
  adapter: polymath_numeric
  require_gold_answer: true
  sample_limit: 20
  sample_offset: 0
  shuffle_seed: 81001

generation:
  max_new_tokens: 4096
  num_samples_per_item: 10
  base_seed: 8100000
  temperature: 0.6
  top_p: 0.95
  top_k: 20

capture:
  enabled: false
  layers: []
  diagnostics: false

prompt:
  mode: chat
  system: "You are a careful mathematical reasoner."
  instruction: |
    Solve the problem and check the result.
    End with exactly: Answer: N
    Replace N with the final numeric answer.
    /think
  chat_template_kwargs:
    enable_thinking: true

analysis:
  produced_answer_regex: "(?i)(?:\\\\boxed\\{|(?:Final\\s+)?Answer\\s*:\\s*)(-?\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)"
  gold_answer_regex: "(-?\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)"
  hard_question_limit: 20
