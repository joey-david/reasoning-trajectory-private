model:
  name: Qwen/Qwen3-14B
  revision: 40c069824f4251a91eefaf281ebe4c544efd3e18
  backend: hf
  device_map:
    "": 0
  dtype: bfloat16
  attn_implementation: flash_attention_2
  trust_remote_code: true

dataset:
  source: hf
  path: EleutherAI/hendrycks_math
  name: algebra
  split: test
  adapter: hendrycks_math
  sample_limit: 50
  sample_offset: 0
  shuffle_seed: 1618
  require_gold_answer: true

generation:
  max_new_tokens: 16000
  num_samples_per_item: 2
  base_seed: 28100000
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  cap_fallback:
    prefix: "</think>\nGiven the reasoning above, the final answer is\nAnswer: "
    min_new_tokens: 3
    max_new_tokens: 16

capture:
  enabled: true
  layers: [-1]
  activation_storage_dtype: int8_scaled
  diagnostics: false

prompt:
  mode: chat
  system: "You are a careful mathematical reasoner."
  instruction: |
    Think only as long as needed. Solve the algebra problem and check the work.
    Put the final answer in \boxed{...}.
    /think
  chat_template_kwargs:
    enable_thinking: true

analysis:
  produced_answer_regex: "\\\\boxed\\{([^}]+)\\}"
  gold_answer_regex: "\\\\boxed\\{([^}]+)\\}"
  think_end_token_id: 151668
  hard_question_limit: 50
