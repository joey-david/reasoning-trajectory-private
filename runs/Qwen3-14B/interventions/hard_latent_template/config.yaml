model:
  name: Qwen/Qwen3-14B
  backend: hf
  device_map:
    "": 0
  dtype: float16
  attn_implementation: flash_attention_2
  trust_remote_code: true

dataset:
  source: jsonl
  path: runs/Qwen3-14B/interventions/hard_latent_template/dataset.jsonl
  adapter: plain_question
  sample_limit: null
  sample_offset: 0
  shuffle_seed: null

generation:
  max_new_tokens: 8192
  num_samples_per_item: 10
  base_seed: 400000
  temperature: 0.7
  top_p: 0.95
  top_k: 20

capture:
  enabled: true
  layers: [-1]
  activation_storage_dtype: int8_scaled
  diagnostics: false

prompt:
  mode: chat
  system: "You are a careful reasoner."
  instruction: |
    Solve the problem. Reason carefully.
    Put the final answer at the end.

analysis:
  produced_answer_regex: "\\\\boxed\\{([^}]+)\\}|(?:Final Answer|Answer)[:*\\s]*([^\\n]+)"
  think_end_token_id: 151668
  token_selector:
    every_n: 8
  token_selectors:
    every_8:
      every_n: 8
    sentence_end:
      mode: sentence_end
    deciles:
      mode: percentiles
      count: 10
    reasoning_boundaries:
      mode: reasoning_boundaries
    first_last:
      mode: first_last
