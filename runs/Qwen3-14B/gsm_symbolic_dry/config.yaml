model:
  name: Qwen/Qwen3-14B
  backend: hf
  device_map:
    "": 0
  dtype: float16
  attn_implementation: flash_attention_2
  trust_remote_code: true

dataset:
  source: hf
  path: apple/GSM-Symbolic
  name: null
  split: test
  adapter: gsm_symbolic
  sample_limit: 10
  sample_offset: 0
  shuffle_seed: 42

generation:
  max_new_tokens: 8192
  num_samples_per_item: 10
  base_seed: 0
  temperature: 0.7
  top_p: 0.95
  top_k: 20

capture:
  enabled: true
  layers: [-1]
  activation_storage_dtype: int8_scaled
  diagnostics: false

prompt:
  mode: chat
  system: "You are a careful mathematical reasoner."
  instruction: |
    Solve the problem. Reason carefully.
    Put the final answer at the end.

analysis:
  produced_answer_regex: "\\\\boxed\\{([^}]+)\\}"
  gold_answer_regex: "####\\s*(-?\\d+(?:\\.\\d+)?)"
  think_end_token_id: 151668
  hard_question_limit: 50
  max_plot_points: 5000
  trajectory_selector: {}
  token_selector:
    every_n: 8
  token_selectors:
    every_8:
      every_n: 8
    sentence_end:
      mode: sentence_end
    deciles:
      mode: percentiles
      count: 10
    reasoning_boundaries:
      mode: reasoning_boundaries
    first_last:
      mode: first_last
