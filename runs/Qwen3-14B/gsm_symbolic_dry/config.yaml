model:
  name: Qwen/Qwen3-14B
  backend: hf
  device_map: auto
  dtype: float16
  trust_remote_code: true

dataset:
  source: hf
  path: apple/GSM-Symbolic
  name: null
  split: test
  adapter: gsm_symbolic
  sample_limit: 10
  sample_offset: 0
  shuffle_seed: 42

generation:
  max_new_tokens: 8192
  num_samples_per_item: 2
  base_seed: 0
  temperature: 0.7
  top_p: 0.95
  top_k: 20

capture:
  enabled: true
  layers: [-1]
  activation_storage_dtype: int8_scaled
  diagnostics: false

prompt:
  mode: chat
  system: "You are a careful mathematical reasoner."
  instruction: |
    Solve the problem. Reason carefully.
    Put the final answer at the end.
