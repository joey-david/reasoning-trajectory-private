model:
  name: HuggingFaceTB/SmolLM3-3B
  dtype: bfloat16
  device: auto
  attn_implementation: sdpa
  trust_remote_code: false
  local_files_only: true

solution_object_extraction:
  scale: small
  bank:
    graph_count: 8
    include_corruptions: true
    splits: [train, validation, heldout_vocab, heldout_template, heldout_question]
  capture:
    layers: [23, 26, 29, 32, 35]
    batch_size: 4
  projection:
    dimension: 24
  mixed_trajectories:
    source_run: runs/SmolLM3-3B/frontier_identification/gsm_symb_pure_mixed_latents_10k
    required: true
    layer: -1
    per_sample: 3
    max_questions: 12
  causal:
    max_pairs_per_condition: 3
    continuation_tokens: 8
  improvement:
    dimensions: [16, 32, 64, 128, 256]
    layers: [23, 26, 29, 32, 35]
    local_dimensions: [16, 32, 64]
    local_layers: [26, 29, 32]
    patch_scopes: [final_token, last_2_tokens, operation_interval, multi_layer]
    nonlinear:
      latent_dimensions: [32, 64]
      hidden_dimension: 128
      epochs: 30
      variants: [mlp, contrastive, contrastive_adversarial]
    writer:
      train_pairs: 48
      validation_pairs: 8
      epochs: [2, 4, 6]
      alpha: [0.5, 1.0, 2.0]
    ablation_grid:
      dimensions: [16, 32]
      scopes: [final_token, operation_interval, multi_layer]
      max_lexical_probe: 0.85
      min_causal_strength: 0.0
      max_cells: 4
