model:
  name: HuggingFaceTB/SmolLM3-3B
  revision: a07cc9a04f16550a088caea529712d1d335b0ac1
  backend: hf
  device_map:
    "": [0, 1]
  dtype: bfloat16
  attn_implementation: flash_attention_2
  trust_remote_code: false

dataset:
  source: jsonl
  path: runs/SmolLM3-3B/gsm_symb_pure_mixed_latents_10k/dataset.jsonl
  adapter: plain_question
  sample_limit: 58
  sample_offset: 0
  shuffle_seed: null

generation:
  max_new_tokens: 10000
  num_samples_per_item: 10
  base_seed: 9120100
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  forced_prefix: "<think> Okay, let's see"
  cap_fallback:
    prefix: "</think> Okay, I've thought about this enough . Given what I know, the final answer should be\n Answer: "
    min_new_tokens: 3
    max_new_tokens: 8

capture:
  enabled: true
  layers: [-1]
  activation_storage_dtype: int8_scaled
  diagnostics: false

prompt:
  mode: chat
  system: "You are a careful mathematical reasoner. /think"
  instruction: |
    Think only as long as needed. Keep the reasoning clear and concise.
    Solve the problem and check the calculation.
    End with exactly: Answer: N
    Replace N with the final numeric answer.
  chat_template_kwargs:
    enable_thinking: true

analysis:
  produced_answer_regex: "(?i)(?:\\\\boxed\\{|(?:Final\\s+)?Answer\\s*:\\s*)(-?\\d[\\d,]*(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)"
  gold_answer_regex: "####\\s*(-?\\d[\\d,]*(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)"
  think_end_token_id: 128003
  hard_question_limit: 58
  max_plot_points: 5000
  max_interactive_points: 6000
  step_classification:
    cluster_k: 8
    max_steps: 12000
    max_plot_steps: 4000
    random_state: 42
    segmenters:
      sentence:
        mode: sentence
        group_size: 1
      sentence_group_2:
        mode: sentence
        group_size: 2
      paragraph:
        mode: paragraph
  token_selector:
    every_n: 8
  token_selectors:
    every_8:
      every_n: 8
    sentence_end:
      mode: sentence_end
    deciles:
      mode: percentiles
      count: 10
    reasoning_boundaries:
      mode: reasoning_boundaries
    first_last:
      mode: first_last
