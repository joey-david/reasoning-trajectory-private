model:
  name: HuggingFaceTB/SmolLM3-3B
  revision: a07cc9a04f16550a088caea529712d1d335b0ac1
  backend: hf
  device_map:
    "": 0
  dtype: bfloat16
  attn_implementation: flash_attention_2
  trust_remote_code: false

dataset:
  source: jsonl
  path: runs/SmolLM3-3B/screening/frontier_identification/gsm_symb_pure_mixed_latents_10k/dataset.jsonl
  adapter: plain_question
  sample_limit: 12

generation:
  max_new_tokens: 4096
  num_samples_per_item: 5
  base_seed: 9120100
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  forced_prefix: "<think> Okay, let's see"
  cap_fallback:
    prefix: "</think>\nAnswer: "
    min_new_tokens: 1
    max_new_tokens: 8

capture:
  enabled: true
  layers: [-1]
  activation_storage_dtype: int8_scaled
  diagnostics: true

prompt:
  mode: chat
  system: |
    You are a careful mathematical reasoner. /think
    Break your reasoning down into explicit numbered steps. Start each step with 'Step X:' on a new line.
  instruction: |
    Think only as long as needed. Solve the problem and check the calculation.
    End with exactly: Answer: N
  demonstrations:
    - user: "A shop packs 3 boxes with 4 pens each. How many pens are packed?"
      assistant: |-
        Step 1: There are 3 boxes with 4 pens in each box.
        Step 2: Multiply 3 by 4 to get 12 pens.
        Answer: 12
  chat_template_kwargs:
    enable_thinking: true

analysis:
  experiment:
    hypothesis: H1
    condition: numbered
  produced_answer_regex: "(?i)(?:\\\\boxed\\{|(?:Final\\s+)?Answer\\s*:\\s*)(-?\\d[\\d,]*(?:\\.\\d+)?)"

