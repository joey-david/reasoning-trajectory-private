model:
  name: mlx-community/SmolLM3-3B-bf16
  backend: mlx
  path: /Users/joey/.cache/huggingface/hub/models--mlx-community--SmolLM3-3B-bf16/snapshots/7bd243308ac4462f1250777fac5c39fd85ab943a
  dtype: bfloat16
dataset:
  source: jsonl
  path: runs/SmolLM3-3B/screening/frontier_identification/gsm_symb_40_60_full_token_mlx/dataset.jsonl
  adapter: plain_question
  sample_limit: 13
  sample_offset: 0
  shuffle_seed: null
generation:
  max_new_tokens: 10000
  num_samples_per_item: 8
  base_seed: 9720100
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  forced_prefix: <think> Okay, let's see
  cap_fallback:
    prefix: "</think>\n Okay, I've thought about this enough. Given what I know, the\
      \ final answer should be\n Answer: "
    min_new_tokens: 3
    max_new_tokens: 8
capture:
  enabled: true
  layers:
  - -1
  activation_storage_dtype: float16
  diagnostics: true
prompt:
  mode: chat
  system: You are a careful mathematical reasoner. /think
  instruction: 'Think only as long as needed. Keep the reasoning clear and concise.

    Solve the problem and check the calculation.

    End with exactly: Answer: N

    Replace N with the final numeric answer.

    '
  chat_template_kwargs:
    enable_thinking: true
analysis:
  produced_answer_regex: (?i)(?:\\boxed\{|(?:Final\s+)?Answer\s*:\s*)(-?\d[\d,]*(?:\.\d+)?(?:[eE][+-]?\d+)?)
  gold_answer_regex: '####\s*(-?\d[\d,]*(?:\.\d+)?(?:[eE][+-]?\d+)?)'
  think_end_token_id: 128003
  hard_question_limit: 58
  max_plot_points: 5000
  max_interactive_points: 6000
  step_classification:
    cluster_k: 8
    max_steps: 12000
    max_plot_steps: 4000
    random_state: 42
    segmenters:
      sentence:
        mode: sentence
        group_size: 1
      sentence_group_2:
        mode: sentence
        group_size: 2
      paragraph:
        mode: paragraph
  token_selector:
    every_n: 8
  token_selectors:
    every_8:
      every_n: 8
    sentence_end:
      mode: sentence_end
    deciles:
      mode: percentiles
      count: 10
    reasoning_boundaries:
      mode: reasoning_boundaries
    first_last:
      mode: first_last
  source_run: runs/SmolLM3-3B/screening/frontier_identification/gsm_symb_pure_mixed_latents_10k
  selection: sample accuracy between 0.40 and 0.60 inclusive in source_run
