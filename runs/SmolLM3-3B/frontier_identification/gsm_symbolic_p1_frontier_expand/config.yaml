model:
  name: HuggingFaceTB/SmolLM3-3B
  revision: a07cc9a04f16550a088caea529712d1d335b0ac1
  backend: hf
  device_map:
    "": 0
  dtype: bfloat16
  attn_implementation: flash_attention_2
  trust_remote_code: false

dataset:
  source: hf
  path: apple/GSM-Symbolic
  revision: 93b5b3758d9d9841ffe81d6cd2ae2b030685b078
  name: p1
  split: test
  adapter: gsm_symbolic
  sample_limit: 80
  sample_offset: 20
  shuffle_seed: 32001

generation:
  max_new_tokens: 4096
  num_samples_per_item: 10
  base_seed: 3110100
  temperature: 0.6
  top_p: 0.95
  top_k: 20

capture:
  enabled: false
  layers: []
  diagnostics: false

prompt:
  mode: chat
  system: "You are a careful mathematical reasoner. /think"
  instruction: |
    Think only as long as needed. Keep the reasoning clear and concise.
    Solve the problem and check the calculation.
    End with exactly: Answer: N
    Replace N with the final numeric answer.
  chat_template_kwargs:
    enable_thinking: true

analysis:
  produced_answer_regex: "(?i)(?:\\\\boxed\\{|(?:Final\\s+)?Answer\\s*:\\s*)(-?\\d[\\d,]*(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)"
  gold_answer_regex: "####\\s*(-?\\d[\\d,]*(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)"
  think_end_token_id: 128003
  hard_question_limit: 80
