model:
  name: Qwen/Qwen3-14B
  revision: 40c069824f4251a91eefaf281ebe4c544efd3e18
  backend: hf
  device_map:
    "": 0
  dtype: float16
  attn_implementation: flash_attention_2
  trust_remote_code: true

dataset:
  source: hf
  path: Hothan/OlympiadBench
  revision: 91184b52131e7fc9455fef848035173aea8cc01a
  name: OE_TO_maths_en_COMP
  split: train
  adapter: olympiadbench_numeric
  require_gold_answer: true
  sample_limit: 12
  sample_offset: 0
  shuffle_seed: 41005

generation:
  max_new_tokens: 8192
  num_samples_per_item: 10
  base_seed: 5000000
  temperature: 0.7
  top_p: 0.95
  top_k: 20

capture:
  enabled: false
  layers: []
  diagnostics: false

prompt:
  mode: chat
  system: "You are a careful olympiad mathematician."
  instruction: |
    Solve the open-ended problem. Check the result.
    End with exactly: Answer: N
    Replace N with the final numeric answer and no units.

analysis:
  produced_answer_regex: "(?i)(?:\\\\boxed\\{|(?:Final\\s+)?Answer\\s*:\\s*)(-?\\d+(?:\\.\\d+)?)"
  gold_answer_regex: "(-?\\d+(?:\\.\\d+)?)"
  hard_question_limit: 200
