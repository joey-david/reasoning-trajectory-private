model:
  name: mistralai/Mistral-7B-Instruct-v0.3
  revision: c170c708c41dac9275d15a8fff4eca08d52bab71
  backend: hf
  required_gpus: 1
  device_map: {"": 0}
  dtype: bfloat16
  attn_implementation: flash_attention_2
  trust_remote_code: false

state_handoff_training:
  linked_runs:
    - runs/Mistral-7B-Instruct-v0.3/interventions/state_interface_horn_outcome
  phase1_source_run: runs/Qwen2.5-32B-Instruct/interventions/state_abstraction_matched_history
  frozen_screen_source_run: runs/Qwen2.5-7B-Instruct/interventions/state_handoff_killtest
  conditions: [canonical_4bit, redundant_5bit]
  evaluation_adapter: final
  dataset:
    domain: horn_proof
    bits: 4
    seed: 725701
    train_examples: 20000
    validation_examples: 2000
    train_horizons: [2]
    validation_horizons: [2]
    test_horizons: [2, 4, 8, 16, 32]
    test_composition_splits: [seen, heldout]
    train_program_contexts: 64
    validation_program_contexts: 16
    test_program_contexts: 30
    test_paths_per_state: 2
  interfaces:
    independent_module_contexts: true
    canonical_4bit:
      permutation: [11, 2, 14, 5, 8, 0, 13, 7, 3, 15, 6, 9, 1, 12, 4, 10]
    producer_modes:
      canonical_4bit: mixed
      redundant_5bit: mixed
    producer_transition_fractions:
      canonical_4bit: 0.75
      redundant_5bit: 0.75
  lora:
    rank: 16
    alpha: 32
    dropout: 0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  training:
    seed: 726801
    max_sequence_length: 256
    microbatch: 8
    gradient_accumulation: 8
    effective_batch: 64
    optimizer: adamw
    learning_rate: 0.0001
    weight_decay: 0
    warmup_ratio: 0.03
    epochs: 2
    evaluation_interval: 250
    max_gradient_norm: 1.0
    gradient_checkpointing: true
  interface_gate:
    primary_condition: redundant_5bit
    min_primary_h8: 0.80
    min_primary_h16: 0.75
  prompt:
    mode: chat
    system: Execute each proof-state update exactly and return one token.

state_interface_generalization:
  outcome_control_run: runs/Mistral-7B-Instruct-v0.3/interventions/state_interface_horn_outcome
  primary_condition: redundant_5bit
  gate:
    domains: [horn_proof_causal_conjunction]
    composition_split: heldout
    history_steps: 16
    min_accuracy: 0.75
    min_improvement: 0.10
    min_state_information_fraction: 0.80
    min_quotient_agreement: 0.80
