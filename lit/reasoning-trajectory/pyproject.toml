[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-trajectory"
version = "0.1.0"
description = "Small toolkit for extracting, inspecting, and analyzing reasoning trajectories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "plotly>=5.18",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.31"]
tables = ["pandas>=2.0", "pyarrow>=14"]
models = ["torch>=2.0", "transformers>=4.40", "datasets>=2.18"]
verification = ["sympy>=1.12", "z3-solver>=4.12"]
all = [
  "streamlit>=1.31",
  "pandas>=2.0",
  "pyarrow>=14",
  "torch>=2.0",
  "transformers>=4.40",
  "datasets>=2.18",
  "sympy>=1.12",
  "z3-solver>=4.12",
  "umap-learn>=0.5",
]

[project.scripts]
rt = "reasoning_trajectory.cli.main:main"

[tool.setuptools.packages.find]
include = ["reasoning_trajectory*"]
