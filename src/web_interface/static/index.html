<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reasoning Trajectory</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="eyebrow">local experiment dashboard</div>
        <h1>Reasoning Trajectory</h1>
        <p id="runMeta">No run loaded.</p>
      </div>
      <div class="job" id="jobStatus" data-status="idle">Idle</div>
    </header>

    <main class="layout">
      <aside class="controls">
        <section class="card">
          <h2>Run</h2>
          <label>Existing run<select id="runSelect" data-testid="run-select"></select></label>
          <button id="loadRun" data-testid="load-run">Load run</button>
        </section>

        <section class="card">
          <h2>Generate</h2>
          <label>Model<select id="modelSelect" data-testid="model-select"></select></label>
          <label>Custom model<input id="customModel" data-testid="custom-model" placeholder="org/model"></label>
          <label>Dataset<select id="datasetSelect" data-testid="dataset-select"></select></label>
          <label>Run name<input id="runName" data-testid="run-name" value="web_run"></label>
          <div class="row">
            <label>Tokens<input id="maxTokens" data-testid="max-tokens" type="number" min="1" value="160"></label>
            <label>Seeds<input id="seeds" data-testid="seeds" value="0,1"></label>
          </div>
          <div class="row">
            <label>Temp<input id="temperatures" data-testid="temperatures" value="0.7"></label>
            <label>Layers<input id="layers" data-testid="layers" value="0,4,8"></label>
          </div>
          <button id="startGeneration" data-testid="start-generation">Start generation</button>
        </section>

        <section class="card">
          <h2>Analyze</h2>
          <button id="runAll" data-testid="run-all-tools">Run all tools</button>
          <div class="toolList" id="toolList"></div>
        </section>
      </aside>

      <section class="workspace">
        <nav class="tabs" id="tabs" data-testid="tool-tabs"></nav>
        <div class="panel" id="panel" data-testid="tool-panel"></div>
      </section>
    </main>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
