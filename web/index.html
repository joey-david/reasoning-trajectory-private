<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reasoning Runs</title>
  <style>
    :root { color-scheme: light; --line:#d8dee4; --muted:#59636e; --ok:#1f7a3f; --bad:#b42318; }
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; color: #111827; background: #fafafa; }
    header { display: flex; gap: 12px; align-items: end; padding: 14px 18px; border-bottom: 1px solid var(--line); background: white; position: sticky; top: 0; z-index: 1; }
    label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
    select, button { font: inherit; border: 1px solid var(--line); background: white; padding: 7px 9px; border-radius: 6px; }
    button[aria-selected="true"] { background: #111827; color: white; }
    main { padding: 18px; display: grid; gap: 14px; }
    .tabs, .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row { border: 1px solid var(--line); border-radius: 8px; background: white; padding: 12px; margin: 10px 0; }
    .meta { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
    .ok { color: var(--ok); font-weight: 650; } .bad { color: var(--bad); font-weight: 650; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; background: #f6f8fa; padding: 10px; border-radius: 6px; }
    img { max-width: min(920px, 100%); border: 1px solid var(--line); border-radius: 8px; background: white; }
    [hidden] { display: none; }
    :focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <label>Model <select id="model" data-testid="model-select"></select></label>
    <label>Run <select id="run" data-testid="run-select"></select></label>
  </header>
  <main>
    <nav class="tabs" aria-label="Views">
      <button id="tab-generation" aria-selected="true" data-testid="generation-tab">Generation</button>
      <button id="tab-analysis" aria-selected="false" data-testid="analysis-tab">Analysis</button>
    </nav>
    <section id="generation-panel">
      <div class="toolbar">
        <label>Iteration <select id="iteration" data-testid="iteration-select"></select></label>
        <label>Step markers <select id="marker" data-testid="marker-select"></select></label>
        <label><input id="entropy" type="checkbox"> Show token entropy</label>
      </div>
      <div id="generations"></div>
    </section>
    <section id="analysis-panel" hidden><div id="plots"></div></section>
  </main>
  <script>
    const state = { manifest: null, run: null, rows: [], markers: null };
    const $ = id => document.getElementById(id);
    const jsonl = text => text.trim().split(/\n+/).filter(Boolean).map(JSON.parse);

    async function init() {
      state.manifest = await fetch("data/runs.json").then(r => r.json()).catch(() => ({ runs: [] }));
      const models = [...new Set(state.manifest.runs.map(r => r.model))];
      $("model").innerHTML = models.map(m => `<option>${m}</option>`).join("");
      $("model").onchange = fillRuns; $("run").onchange = loadRun;
      $("tab-generation").onclick = () => tab("generation");
      $("tab-analysis").onclick = () => tab("analysis");
      $("iteration").onchange = renderGenerations; $("marker").onchange = renderGenerations; $("entropy").onchange = renderGenerations;
      fillRuns();
    }
    function fillRuns() {
      const runs = state.manifest.runs.filter(r => r.model === $("model").value);
      $("run").innerHTML = runs.map(r => `<option>${r.run}</option>`).join("");
      loadRun();
    }
    async function loadRun() {
      state.run = state.manifest.runs.find(r => r.model === $("model").value && r.run === $("run").value);
      if (!state.run) return;
      state.rows = await fetch(state.run.generations).then(r => r.text()).then(jsonl);
      state.markers = state.run.step_markers ? await fetch(state.run.step_markers).then(r => r.json()).catch(() => null) : null;
      const seeds = [...new Set(state.rows.map(r => r.seed))];
      $("iteration").innerHTML = [`<option value="">all</option>`, ...seeds.map(s => `<option>${s}</option>`)].join("");
      const markerNames = state.markers ? Object.keys(state.markers.selectors) : [];
      $("marker").innerHTML = [`<option value="">none</option>`, ...markerNames.map(s => `<option>${s}</option>`)].join("");
      renderGenerations(); renderPlots();
    }
    function tab(name) {
      for (const key of ["generation", "analysis"]) {
        $(`tab-${key}`).setAttribute("aria-selected", key === name);
        $(`${key}-panel`).hidden = key !== name;
      }
    }
    function renderGenerations() {
      const seed = $("iteration").value;
      const rows = seed ? state.rows.filter(r => String(r.seed) === seed) : state.rows;
      $("generations").innerHTML = rows.map(rowHtml).join("");
    }
    function rowHtml(row) {
      const sample = state.run.samples[row.sample_id] || {};
      const cls = row.is_correct === true ? "ok" : row.is_correct === false ? "bad" : "";
      const markerText = markerSummary(row);
      return `<article class="row">
        <div class="meta"><span>${row.sample_id}</span><span>seed ${row.seed}</span><span class="${cls}">${row.is_correct}</span><span>answer ${row.produced_answer ?? ""}</span><span>reasoning ${row.reasoning_length ?? ""}</span></div>
        ${markerText ? `<div class="meta">markers: ${markerText}</div>` : ""}
        <details><summary>Prompt</summary><pre>${escapeHtml(sample.prompt || "")}</pre></details>
        <details><summary>Gold</summary><pre>${escapeHtml(sample.gold_answer || "")}</pre></details>
        <pre>${formatText(row)}</pre>
      </article>`;
    }
    function markerSummary(row) {
      const name = $("marker").value;
      if (!name || !state.markers) return "";
      const record = state.markers.records.find(r => r.sample_id === row.sample_id && String(r.seed) === String(row.seed));
      const values = record?.selectors?.[name] || [];
      return values.join(", ");
    }
    function formatText(row) {
      if (!$("entropy").checked || !row.timesteps) return escapeHtml(row.produced_text || "");
      return row.timesteps.map(t => {
        const e = Array.isArray(t.entropy) ? Math.max(...t.entropy) : 0;
        return `<span style="background:hsl(${210 - Math.min(e * 20, 160)} 90% 85%)">${escapeHtml(t.token_str || "")}</span>`;
      }).join("");
    }
    function renderPlots() {
      $("plots").innerHTML = (state.run.plots || []).map(p => `<figure><img src="${p.path}" alt="${p.method} layer ${p.layer}"><figcaption>${p.method.toUpperCase()} layer ${p.layer} · ${p.trajectories ?? "?"} trajectories</figcaption></figure>`).join("") || "<p>No plots yet.</p>";
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
    init();
  </script>
</body>
</html>
